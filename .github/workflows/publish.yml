name: Publish
on:
  push:
    tags: ['*.*.*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm scan
      - name: Verify tag matches package version
        run: node -e "const p = require('./package.json'); if (process.env.GITHUB_REF_NAME.replace(/^v/, '') !== p.version) process.exit(1)"
      # Configure npm Trusted Publishing for this repository and publish.yml.
      # The n8n CLI invokes npm publish internally with provenance enabled.
      - run: pnpm release
