name: Publish
on:
  push:
    tags: ['*.*.*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm scan
      - name: Verify tag matches package version
        run: node -e "const p = require('./package.json'); if (process.env.GITHUB_REF_NAME.replace(/^v/, '') !== p.version) process.exit(1)"
      - name: Select npm release channel
        id: channel
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const prerelease = version.split('-')[1];
          if (prerelease && !/^beta\.\d+$/.test(prerelease)) {
            throw new Error('Only stable or beta.N releases are supported by this workflow');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${prerelease ? 'beta' : 'latest'}\n`);
          NODE
      # First publication: add a short-lived granular npm token as NPM_TOKEN.
      # Afterward, configure npm Trusted Publishing for this repo/publish.yml
      # and remove NPM_TOKEN. npm then authenticates using GitHub OIDC.
      # The n8n CLI invokes npm publish internally with provenance enabled.
      - name: Publish with n8n-node
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TAG: ${{ steps.channel.outputs.tag }}
          NPM_CONFIG_ACCESS: public
      - name: Keep beta off latest
        if: steps.channel.outputs.tag == 'beta'
        run: node scripts/ensure-beta-tag.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
